<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        form {
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            height: 70px;
        }

        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form id="studentForm">

        <label>Student ID:</label>
        <input type="text" id="studentId" required>

        <label>Student Name:</label>
        <input type="text" id="name" required>

        <label>Email:</label>
        <input type="email" id="email" required>

        <label>Phone Number:</label>
        <input type="tel" id="phone" required>

        <label>Age:</label>
        <input type="number" id="age" required>

        <label>Gender:</label>
        <select id="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Date of Birth:</label>
        <input type="date" id="dob" required>

        <label>Course:</label>
        <select id="course" required>
            <option value="">Select Course</option>
            <option>CSE</option>
            <option>ECE</option>
            <option>EEE</option>
            <option>MECH</option>
            <option>CIVIL</option>
        </select>

        <label>Year:</label>
        <select id="year" required>
            <option value="">Select Year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select>

        <label>Address:</label>
        <textarea id="address" required></textarea>

        <button type="submit">Register Student</button>

    </form>

    <h2>Registered Students</h2>

    <table id="studentTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Age</th>
                <th>Gender</th>
                <th>DOB</th>
                <th>Course</th>
                <th>Year</th>
                <th>Address</th>
            </tr>
        </thead>

        <tbody></tbody>
    </table>

    <script>
        document.getElementById("studentForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const studentId = document.getElementById("studentId").value;
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const phone = document.getElementById("phone").value;
            const age = document.getElementById("age").value;
            const gender = document.getElementById("gender").value;
            const dob = document.getElementById("dob").value;
            const course = document.getElementById("course").value;
            const year = document.getElementById("year").value;
            const address = document.getElementById("address").value;

            const tableBody = document.querySelector("#studentTable tbody");
            const newRow = tableBody.insertRow();

            newRow.insertCell(0).textContent = studentId;
            newRow.insertCell(1).textContent = name;
            newRow.insertCell(2).textContent = email;
            newRow.insertCell(3).textContent = phone;
            newRow.insertCell(4).textContent = age;
            newRow.insertCell(5).textContent = gender;
            newRow.insertCell(6).textContent = dob;
            newRow.insertCell(7).textContent = course;
            newRow.insertCell(8).textContent = year;
            newRow.insertCell(9).textContent = address;

            document.getElementById("studentForm").reset();
        });
    </script>

</body>
</html>
